# 旅游票务平台通用配置。
# 敏感信息优先通过环境变量提供，不要把真实账号和密码提交到 Git。

spring:
  application:
    name: tourism-server

  # MySQL 数据源。启动前必须通过环境变量提供账号和密码。
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tourism_ticketing_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池大小应结合数据库最大连接数和服务实例数调整。
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      pool-name: TourismHikariPool

  # 数据库版本管理，脚本放在 src/main/resources/db/migration。
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true

  # JSON 序列化统一采用中国时区，并忽略值为 null 的字段。
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

  mvc:
    # 启用 RFC 9457 Problem Details，便于统一返回接口错误。
    problemdetails:
      enabled: true

  lifecycle:
    # 收到停机信号后，最多等待正在处理的请求 30 秒。
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 2KB
  error:
    # 生产环境不直接暴露异常、堆栈和参数校验细节。
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

mybatis:
  # Mapper XML 建议统一放在 src/main/resources/mapper 下。
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.qinghuan.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  level:
    root: INFO
    com.qinghuan: ${APP_LOG_LEVEL:INFO}
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
