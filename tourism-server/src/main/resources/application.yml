# 旅游票务平台通用配置。
# 敏感信息优先通过环境变量提供，不要把真实账号和密码提交到 Git。

spring:
  application:
    name: tourism-server

  # MySQL 数据源。启动前必须通过环境变量提供账号和密码。
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tourism_ticketing_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:baidu12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池大小应结合数据库最大连接数和服务实例数调整。
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
      pool-name: TourismHikariPool

  # 数据库版本管理，脚本放在 src/main/resources/db/migration。
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true

  # JSON 序列化统一采用中国时区，并忽略值为 null 的字段。
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

  mvc:
    # 启用 RFC 9457 Problem Details，便于统一返回接口错误。
    problemdetails:
      enabled: true

  lifecycle:
    # 收到停机信号后，最多等待正在处理的请求 30 秒。
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      connect-timeout: 3s
      timeout: 3s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 2KB
  error:
    # 生产环境不直接暴露异常、堆栈和参数校验细节。
    include-message: never
    include-stacktrace: never
    include-binding-errors: never


mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.qinghuan.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  level:
    root: INFO
    com.qinghuan: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.flyway: DEBUG

  file:
    name: logs/tourism-server.log

  logback:
    rolling policy:
      file-name-pattern: logs/tourism-server.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT 密钥必须是至少 32 字节随机值的 Base64 编码，示例：openssl rand -base64 32。
security:
  jwt:
    secret: ${JWT_SECRET:xdOZKwwUsqn/61S40mPfDsPXLt4zQsAlxtMG8wtF160=}
    issuer: tourism-ticketing-platform
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:12h}
    excluded-paths:
      - /auth/login
      - /auth/register
      - /public/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /error

# 阿里云 OSS。默认值仅用于让本地项目正常启动，上传前必须通过环境变量替换。
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
    region: ${OSS_REGION:cn-hangzhou}
    access-key-id: ${OSS_ACCESS_KEY_ID:YOUR_OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:YOUR_OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:YOUR_OSS_BUCKET_NAME}
