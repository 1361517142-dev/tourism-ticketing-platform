# ================= 必填参数 =================

# 本次测试使用的优惠券活动 ID。
# 活动必须处于 PUBLISHED、已进入领取时间且已经完成 Redis 预热。
activity_id=2

# 并发线程数。
threads=200

# unique：users.csv 每行必须是不同游客，用于测试防超卖和吞吐量。
# single：只使用 users.csv 第一行，并复制给所有线程，用于测试一人一券。
user_mode=unique

# 游客账号文件，相对路径以本目录为基准。
credentials_file=users.csv

# ================= 常用可选参数 =================

protocol=http
host=localhost
port=8080

# 所有线程在多少秒内完成启动；登录完成后还会在抢券请求前集合。
ramp_up_seconds=1
synchronize_users=true

# false：只压测抢券入口，适合测 TPS、P95、P99。
# true：抢券后继续轮询最终结果，适合测 Kafka 异步发券端到端耗时。
poll_final_result=false
poll_interval_ms=100
max_poll_count=50

# 抢券请求结束后额外等待消费者落库，便于随后执行生成的核对 SQL。
result_wait_seconds=3

# ================= 工具参数，一般不用修改 =================

connect_timeout_ms=3000
response_timeout_ms=5000
jmeter_home=C:\apache-jmeter-5.6.3
jmeter_version=5.6.3
auto_download_jmeter=false
